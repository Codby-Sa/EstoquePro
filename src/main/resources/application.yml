server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        "format_sql": true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    "org.hibernate.SQL": DEBUG